<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Document</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

html,
body {
width: 100%;
height: 100%;
background: #ffffff;
}

.pages {
display: flex;
width: 100%;
height: 100%;

overflow-x: auto;
overflow-y: hidden;

scroll-snap-type: x mandatory;
scroll-behavior: smooth;

-webkit-overflow-scrolling: touch;
}

.page {
flex: 0 0 100%;
width: 100%;
height: 100%;

display: flex;
justify-content: center;
align-items: flex-start;

scroll-snap-align: start;
overflow-y: auto;
}

.page img {
display: block;
width: 100%;
height: auto;
}

.instruction {
position: fixed;
bottom: 15px;
left: 50%;
transform: translateX(-50%);

padding: 8px 14px;
border-radius: 20px;

background: rgba(0, 0, 0, 0.65);
color: white;

font-family: Arial, sans-serif;
font-size: 14px;

z-index: 10;
pointer-events: none;
}
</style>
</head>

<body>

<div class="pages">

<section class="page">
<img src="page1.png" alt="Page 1">
</section>

<section class="page">
<img src="page2.png" alt="Page 2">
</section>

</div>

<div class="instruction">
Faites glisser pour voir la suite →
</div>

</body>
</html>
